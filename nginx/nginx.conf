events {}

http {
    # structured blue/green log
    log_format bluegreen '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         'pool="$upstream_http_x_app_pool" '
                         'release="$upstream_http_x_release_id" '
                         'upstream_status="$upstream_status" '
                         'upstream_addr="$upstream_addr" '
                         'req_time=$request_time '
                         'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/bluegreen.log bluegreen;
    error_log  /var/log/nginx/error.log warn;

    upstream backend {
        # Blue is primary
        server app_blue:3000 max_fails=2 fail_timeout=3s;
        # Green is backup
        server app_green:3000 backup;
    }

    server {
        listen 80;

        # All routes (/, /version, /chaos/*)
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # automatic failover when blue fails
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}

