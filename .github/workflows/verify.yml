name: verify blue-green
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # 1) Make sure Docker Engine + Compose are installed and usable (with sudo)
      - name: Ensure Docker & Compose
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y docker.io
          fi
          sudo systemctl status docker || true
          sudo docker version
          if ! sudo docker compose version >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y docker-compose-plugin
          fi
          sudo docker compose version
          sudo docker info

      # (Optional) Uncomment if pulls are private/rate-limited
      # - name: Docker Hub login
      #   env:
      #     DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      #     DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      #   run: echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # 2) Seed .env used by docker-compose.yml
      - name: Seed .env
        shell: bash
        run: |
          set -euxo pipefail
          cat > .env <<'ENV'
          BLUE_IMAGE=yimikaade/wonderful:devops-stage-two
          GREEN_IMAGE=yimikaade/wonderful:devops-stage-two
          ACTIVE_POOL=blue
          RELEASE_ID_BLUE=blue-v1.0.0
          RELEASE_ID_GREEN=green-v1.0.0
          PORT=3000
          ENV
          echo "------ .env"; cat .env
          echo "------ docker-compose.yml (head)"
          sed -n '1,200p' docker-compose.yml || true

      # 3) Pre-pull images with retries (avoid early fail from network/ratelimit)
      - name: Warm & pull images (with retries)
        shell: bash
        run: |
          set -euo pipefail
          . ./.env
          for img in "$BLUE_IMAGE" "$GREEN_IMAGE"; do
            echo "Pulling $img ..."
            n=0
            until sudo docker pull "$img"; do
              n=$((n+1))
              if [ $n -ge 6 ]; then echo "::error::Failed to pull $img"; exit 1; fi
              sleep $((2*n))
            done
          done

      # 4) Bring stack up; show status; verify containers exist
      - name: Up stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo docker compose down -v || true
          sudo docker compose up -d
          sudo docker compose ps
          echo "Docker networks:"
          sudo docker network ls
          echo "Docker images (top 20):"
          sudo docker images | head -n 20

      # 5) Wait until both pools are healthy (defensive retries)
      - name: Wait for blue & green health
        shell: bash
        run: |
          set -euo pipefail
          attempt() { curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 5 "$1" || true; }
          for i in $(seq 1 120); do
            b=$(attempt http://127.0.0.1:8081/healthz)
            g=$(attempt http://127.0.0.1:8082/healthz)
            echo "try=$i blue=$b green=$g"
            if [ "$b" = "200" ] && [ "$g" = "200" ]; then
              echo "Both pools healthy"; break
            fi
            sleep 1
          done
          [ "$b" = "200" ] && [ "$g" = "200" ]

      # 6) Baseline should be BLUE at the edge (nginx/proxy)
      - name: Baseline blue
        shell: bash
        run: |
          set -euo pipefail
          hdrs=$(curl -sI --retry 3 --retry-delay 2 --max-time 5 http://127.0.0.1:8080/version)
          printf "%s\n" "$hdrs"
          code=$(printf "%s\n" "$hdrs" | awk 'NR==1{print $2}')
          pool=$(printf "%s\n" "$hdrs" | awk -F": " '/^X-App-Pool:/{print $2}')
          rid=$(printf "%s\n" "$hdrs" | awk -F": " '/^X-Release-Id:/{print $2}')
          [ "$code" = "200" ]
          [ "$pool" = "blue" ]
          [ "$rid" = "blue-v1.0.0" ]

      # 7) Break BLUE and prove failover to GREEN
      - name: Induce chaos on blue
        shell: bash
        run: |
          set -euxo pipefail
          curl -s -XPOST --retry 3 --retry-delay 1 "http://127.0.0.1:8081/chaos/start?mode=error" || true

      - name: Prove failover to green (0 non-200; >=95% green)
        shell: bash
        run: |
          set -euo pipefail
          non200=0; green=0; total=60
          for i in $(seq 1 $total); do
            hdrs=$(curl -sI --retry 2 --retry-delay 1 --max-time 3 http://127.0.0.1:8080/version || true)
            code=$(printf "%s\n" "$hdrs" | awk 'NR==1{print $2}')
            pool=$(printf "%s\n" "$hdrs" | awk -F": " '/^X-App-Pool:/{print $2}')
            [ "$code" = "200" ] || non200=$((non200+1))
            [ "$pool" = "green" ] && green=$((green+1))
            sleep 0.1
          done
          echo "non200=$non200 green=$green/$total"
          [ "$non200" -eq 0 ]
          pct=$((100*green/total))
          [ "$pct" -ge 95 ]

      # 8) Heal BLUE and ensure traffic returns to BLUE
      - name: Stop chaos and verify back to blue
        shell: bash
        run: |
          set -euo pipefail
          curl -s -XPOST --retry 3 --retry-delay 1 "http://127.0.0.1:8081/chaos/stop" || true
          sleep 1
          hdrs=$(curl -sI --retry 3 --retry-delay 1 --max-time 5 http://127.0.0.1:8080/version)
          printf "%s\n" "$hdrs"
          code=$(printf "%s\n" "$hdrs" | awk 'NR==1{print $2}')
          pool=$(printf "%s\n" "$hdrs" | awk -F": " '/^X-App-Pool:/{print $2}')
          rid=$(printf "%s\n" "$hdrs" | awk -F": " '/^X-Release-Id:/{print $2}')
          [ "$code" = "200" ]
          [ "$pool" = "blue" ]
          [ "$rid" = "blue-v1.0.0" ]

      # 9) On any failure, dump maximum diagnostics
      - name: Collect compose logs (always on failure)
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          sudo docker compose ps || true
          sudo docker compose logs --no-color > compose-logs.txt || true
          sudo docker ps -a > docker-ps-a.txt || true
          sudo docker images > docker-images.txt || true
          (printf "Listening ports:\n"; sudo ss -lntp || true) > ports.txt
          # If services are named 'blue' and 'green', capture inspect output too:
          for s in blue green nginx; do
            sudo docker inspect "$s" > "inspect-$s.json" 2>/dev/null || true
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            compose-logs.txt
            docker-ps-a.txt
            docker-images.txt
            ports.txt
            inspect-*.json

